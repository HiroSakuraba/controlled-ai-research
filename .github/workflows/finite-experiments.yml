name: Finite control experiments

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate finite experiment report
        run: |
          mkdir -p reports
          python -m controlled_ai > reports/finite-run-${GITHUB_SHA}.json

      - name: Publish report and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-control-${{ github.run_id }}
          path: |
            reports/finite-run-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
